<!doctype html>
<html lang="en"><meta charset="utf-8"><title>3D renderer smoke tests</title>
<style>body{margin:0;background:#182233;color:white;font:16px monospace}canvas{position:fixed;inset:0;width:100%;height:100%}pre{position:fixed;z-index:2;background:#102030ed;padding:20px;white-space:pre-wrap}</style>
<canvas id="game"></canvas><pre id="report">Running 3D checks…</pre>
<script type="module">
import { Game } from '../src/game.js';
import { getLevel } from '../src/levels.js';
import { emptyUpgrades } from '../src/upgrades.js';
const report = document.querySelector('#report');
const lines = [];
const assert = (value, message) => { if (!value) throw Error(message); lines.push('PASS: ' + message); };
try {
  const game = new Game(document.querySelector('#game'), {});
  game.setPaused(true);
  assert(game.view3d, 'WebGL renderer initialized');
  const view = game.view3d;
  for (const n of [1, 3, 55, 90]) {
    const oldTextures = [...view.textures];
    let disposed = 0;
    oldTextures.forEach(t => t.addEventListener('dispose', () => disposed++));
    game.start(getLevel(n), emptyUpgrades());
    game.skipIntro(); game.cam = { ...game.world.spawn }; game.zoom = 1;
    game.render();
    assert(view.renderer.info.render.calls > 0, `Level ${n} renders a scene`);
    assert(view.renderer.getContext().getError() === 0, `Level ${n} has no WebGL errors`);
    assert(disposed === oldTextures.length, `Level ${n} releases previous textures`);
    const center = view.project(game.cam.x, game.cam.y);
    assert(Math.abs(center.x - game.w / 2) < 1 && Math.abs(center.y - game.h / 2) < 1, 'Camera projection tracks its target');
  }
  const food = { kind:'car', x:game.hole.x, y:game.hole.y, r:10, w:24, h:12, angle:0, color:'#f95a65', pts:2 };
  game.world.objects.push(food); game.render();
  food.falling = true; food.fallT = 0.5; food.fx = food.x; food.fy = food.y;
  game.render();
  const model = view.models.get(food);
  assert(model.position.y < 0 && model.scale.x < 1, 'Swallow animation sinks and shrinks the 3D object');
  food.eaten = true; game.render(); assert(!model.visible, 'Eaten objects disappear');
  const gate = {kind:'eventGate',x:game.hole.x + 30,y:game.hole.y,r:20};
  game.world.objects.push(gate); game.render(); assert(view.models.has(gate), 'Dynamically spawned event objects render');
  const before = game.time; game.update(1); assert(game.time === before, 'Pause stops simulation');
  view.lost = true; game.render(); view.lost = false; game.render();
  assert(true, 'Canvas fallback and return to 3D render without errors');
  report.textContent = lines.join('\n') + '\nALL 3D CHECKS PASSED';
} catch (error) { report.textContent = lines.join('\n') + '\nFAIL: ' + error.stack; console.error(error); }
</script></html>
