<!doctype html><meta charset="utf-8"><title>3D benchmark</title>
<style>body{margin:0;background:#182233;color:white;font:14px monospace}canvas{position:fixed;inset:0;width:100%;height:100%}pre{position:fixed;z-index:3;background:#102030ed;padding:12px;max-width:90vw;white-space:pre-wrap}</style>
<canvas id="game"></canvas><pre id="report">Measuring…</pre>
<script type="module">
import {Game} from '../src/game.js';
import {getLevel} from '../src/levels.js';
import {emptyUpgrades} from '../src/upgrades.js';
let seed=723; Math.random=()=>((seed=Math.imul(1664525,seed)+1013904223|0)>>>0)/4294967296;
const game=new Game(document.querySelector('canvas'),{}); game.setPaused(true);
game.start(getLevel(1),emptyUpgrades()); game.skipIntro(); game.banner=null;
game.cam={...game.world.spawn}; game.zoom=Math.min(innerWidth,innerHeight)/900;
const samples=[], intervals=[]; let calls=0,triangles=0,last=0;
for(let i=0;i<150;i++) {
  const ts=await new Promise(requestAnimationFrame); const start=performance.now();
  game.time+=1/60; game.render();
  if(i>=30){samples.push(performance.now()-start);intervals.push(ts-last);calls+=game.view3d.renderer.info.render.calls;triangles+=game.view3d.renderer.info.render.triangles;}
  last=ts;
}
samples.sort((a,b)=>a-b);intervals.sort((a,b)=>a-b);
document.querySelector('#report').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],objects:game.world.objects.length,drawCalls:Math.round(calls/120),triangles:Math.round(triangles/120),renderMedianMs:+samples[60].toFixed(2),renderP95Ms:+samples[114].toFixed(2),frameMedianMs:+intervals[60].toFixed(2),frameP95Ms:+intervals[114].toFixed(2)},null,2);
</script>
